name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest --cov=paperless_mcp --cov-fail-under=85
      - name: Build distributions
        run: uv run --no-project --with build python -m build
      - name: Check distributions
        run: uv run --no-project --with twine twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual workflow_dispatch run stops after
    # `build`, which makes it a safe dry run: PyPI rejects re-uploading a
    # version that already exists, so dispatching on an unchanged version
    # would otherwise always fail.
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "Paperless MCP ${GITHUB_REF_NAME}" \
            --generate-notes
