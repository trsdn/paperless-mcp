name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest --cov=paperless_mcp --cov-fail-under=85
      - name: Build distributions
        run: uv build
      - name: Verify wheel installation
        run: |
          uv venv .smoke --python ${{ matrix.python-version }}
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import paperless_mcp.server"
          test -x .smoke/bin/paperless-mcp
