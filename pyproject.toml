[project]
name = "paperless-mcp"
version = "0.1.0"
description = "MCP server for Paperless-ngx (HTTP transport, bearer auth)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Torsten" }]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
paperless-mcp = "paperless_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]
