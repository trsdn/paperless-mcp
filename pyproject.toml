[project]
name = "paperless-mcp"
version = "0.1.1"
description = "Authenticated MCP server for searching and managing Paperless-ngx documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Torsten Mahr" }]
keywords = ["document-management", "fastmcp", "mcp", "model-context-protocol", "paperless-ngx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Changelog = "https://github.com/trsdn/paperless-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/trsdn/paperless-mcp#readme"
Issues = "https://github.com/trsdn/paperless-mcp/issues"
Repository = "https://github.com/trsdn/paperless-mcp"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
paperless-mcp = "paperless_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
